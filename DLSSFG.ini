[DLSSFG]
; 1 = DLSS Frame Generation on (needs DLSS on in the game's graphics settings, Vulkan API)
; 0 = off: the mod changes nothing and only writes DLSSFG.log
; In game, Insert turns frame generation off/on to compare.
Enabled=1
; 1 = space the generated and real frames half a frame apart and keep the game just under half the refresh rate
; 0 = present them back to back (the older behaviour)
Pacing=1
